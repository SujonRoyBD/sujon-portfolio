<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#19153a" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7639" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF7639" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="accentCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF7639" />
    </linearGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg2)" />
  <circle cx="950" cy="180" r="200" fill="#8B5CF6" opacity="0.2" filter="url(#blur2)" />
  <circle cx="250" cy="550" r="220" fill="#FF7639" opacity="0.18" filter="url(#blur2)" />

  <!-- App Window -->
  <rect x="80" y="60" width="1120" height="600" rx="16" fill="#0b1120" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Header bar -->
  <path d="M 80,60 L 1200,60 A 16,16 0 0,1 1200,108 L 80,108 Z" fill="#141c2e" />
  <circle cx="115" cy="84" r="6" fill="#EF4444" />
  <circle cx="135" cy="84" r="6" fill="#F59E0B" />
  <circle cx="155" cy="84" r="6" fill="#10B981" />
  <text x="220" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">NexusPay Enterprise Dashboard</text>

  <!-- Left Stats & Chart -->
  <rect x="110" y="130" width="670" height="490" rx="12" fill="#111a2e" stroke="rgba(255,255,255,0.06)" />
  <text x="140" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">TOTAL PORTFOLIO BALANCE</text>
  <text x="140" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$128,450.80</text>
  <text x="375" y="212" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="600">▲ +14.2% this month</text>

  <!-- Chart Area -->
  <path d="M 140,420 C 220,380 270,410 350,330 C 430,250 510,310 590,260 C 670,210 720,240 760,190 L 760,460 L 140,460 Z" fill="url(#chartGrad)" />
  <path d="M 140,420 C 220,380 270,410 350,330 C 430,250 510,310 590,260 C 670,210 720,240 760,190" fill="none" stroke="#FF7639" stroke-width="4" stroke-linecap="round" />

  <!-- Metric Badges -->
  <rect x="140" y="530" width="180" height="60" rx="8" fill="#162238" />
  <text x="155" y="555" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">BTC/USD</text>
  <text x="155" y="576" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">$64,280.00</text>

  <rect x="340" y="530" width="180" height="60" rx="8" fill="#162238" />
  <text x="355" y="555" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">ETH/USD</text>
  <text x="355" y="576" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">$3,490.50</text>

  <rect x="540" y="530" width="180" height="60" rx="8" fill="#162238" />
  <text x="555" y="555" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">STAKING APY</text>
  <text x="555" y="576" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="700">8.4% p.a.</text>

  <!-- Right Credit Card & Actions -->
  <rect x="805" y="130" width="365" height="210" rx="16" fill="url(#accentCard)" />
  <text x="835" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Nexus Platinum Card</text>
  <text x="835" y="240" fill="#ffffff" font-family="monospace" font-size="20" letter-spacing="3">•••• •••• •••• 9428</text>
  <text x="835" y="300" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="13">CARDHOLDER</text>
  <text x="835" y="320" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">SUJON SHEIKH</text>
  <text x="1110" y="320" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="end">EXP 08/29</text>

  <!-- Quick Transfer List -->
  <rect x="805" y="360" width="365" height="260" rx="12" fill="#111a2e" stroke="rgba(255,255,255,0.06)" />
  <text x="830" y="395" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Recent Transactions</text>
  
  <rect x="830" y="420" width="315" height="50" rx="8" fill="#162238" />
  <text x="845" y="450" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14">Vercel Inc. Subscription</text>
  <text x="1130" y="450" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">-$40.00</text>

  <rect x="830" y="485" width="315" height="50" rx="8" fill="#162238" />
  <text x="845" y="515" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14">Upwork Escrow Payout</text>
  <text x="1130" y="515" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">+$1,450.00</text>

  <rect x="830" y="550" width="315" height="50" rx="8" fill="#162238" />
  <text x="845" y="580" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14">GitHub Enterprise</text>
  <text x="1130" y="580" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">-$21.00</text>
</svg>
